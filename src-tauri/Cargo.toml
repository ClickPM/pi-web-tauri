[package]
name = "pi-web-tauri"
version = "0.5.0"
description = "Pi — desktop shell for pi-web (Tauri 2)"
authors = ["pi-web-desktop"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "pi_web_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
url = "2"

[target."cfg(windows)".dependencies]
# Strips the Windows verbatim prefix (backslash-backslash-question-backslash)
# that Tauri's resource_dir() returns in a PACKAGED build. Node cannot resolve a
# main module through that prefix — it dies with
# "EISDIR: illegal operation on a directory, lstat 'D:'" — so every path handed
# to the bundled node has to be simplified first. dunce does it correctly,
# including leaving genuinely long paths (which need the prefix) alone.
dunce = "1"
# Safe wrapper over Win32 job objects — the whole reason the shell can promise
# that killing it takes the node tree with it. See PORTING.md ("坑 5").
win32job = "2"

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-single-instance = "2"

[features]
# Enabled by `tauri dev`/`tauri build`; do not remove.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
